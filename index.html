<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/leaf.png"/>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script> <!-- src, nao href -->
    <title>Leaf - Send messages</title>
</head>
<body>
    <header class="header1">
        <div class="logo">
            <img src="./img/leaf.png" alt="Leaf Icon">
            <h1>Leaf</h1>
        </div>
        <input type="text" placeholder="Digite um telefone aqui...">
    </header>
    <main>
        <div class="container">
            <aside>
                <div class="SBcontainer">
                    <div>
                        <img src="./img/search.png" alt="Search">
                    </div>
                </div>
                <ul id="listaContatos">
                </ul>
            </aside>
            <div class="containerConversas">
                <header id="header">
                    <img src="./img/user.png" alt="">
                    <h1 id="nomeContato">Leaf</h1>
                </header>
                <div class="conversa">
                        <ul id="messages">
                            <li>
                                <p>Bem-vindo ao Leaf!</p>
                            </li>
                            
                    </ul>
                </div>
                <div class="containerInput">
                    <!-- emoji, input -->
                     <div>
                        <button>
                            <img src="./img/emoji.png" alt="">
                        </button>
                        <input type="text">
                        <button>
                            <img src="./img/send.png" alt="">
                        </button>
                     </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
